<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Occlusion Birleştirici</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#dcdcd6;--acc:#2f6fed;--accfg:#fff;--ok:#1f8a4c;--bad:#c23b32;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--text:#eeeeea;--muted:#9a9a93;--line:#3a3a37;--acc:#5b92f5;--accfg:#0d1b33;--ok:#4cc27f;--bad:#ee7a72}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--text:#eeeeea;--muted:#9a9a93;--line:#3a3a37;--acc:#5b92f5;--accfg:#0d1b33;--ok:#4cc27f;--bad:#ee7a72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.zones{grid-template-columns:1fr}}
.zone{display:block;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s}
.zone:hover,.zone.over{border-color:var(--acc)}
.zone.ok{border-style:solid;border-color:var(--ok)}
.zone b{display:block;margin-bottom:4px}
.zone span{font-size:13px;color:var(--muted);word-break:break-all}
.zone input{display:none}
button{font:inherit;border:0;border-radius:10px;padding:11px 20px;background:var(--acc);color:var(--accfg);font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.row{margin:18px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#msg{font-size:14px;color:var(--muted)}
#msg.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.bad{color:var(--bad)}.good{color:var(--ok)}
input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);min-width:0;flex:1 1 200px}
.warn{margin-top:10px;font-size:14px;color:var(--bad)}
.foot{color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1>Occlusion Birleştirici</h1>
  <p class="sub">İki occlusion.ymap.xml dosyasını yükle. Sadece ikisinde de bulunan kayıtlar kalır, birinde olup diğerinde olmayanlar silinir.</p>

  <div class="zones">
    <label class="zone" id="z0"><input type="file" id="f0" accept=".xml"><b>1. Occlusion</b><span id="n0">Dosyayı sürükle veya tıkla</span></label>
    <label class="zone" id="z1"><input type="file" id="f1" accept=".xml"><b>2. Occlusion</b><span id="n1">Dosyayı sürükle veya tıkla</span></label>
  </div>

  <div class="row">
    <button id="go" disabled>Birleştir</button>
    <span id="msg"></span>
  </div>

  <div id="out" hidden>
    <div class="card scroll">
      <table>
        <thead><tr><th>Bölüm</th><th>Dosya 1</th><th>Dosya 2</th><th>Ortak</th><th>1'den silinen</th><th>2'den silinen</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="warn" id="warn"></div>
    </div>
    <div class="row">
      <input type="text" id="name" value="occlusion3.ymap.xml" aria-label="Çıktı dosya adı">
      <button id="dl">İndir</button>
    </div>
  </div>

  <p class="foot">Dosyalar sunucuya yüklenmez, her şey tarayıcında işlenir.</p>
</main>

<script>
const SECTIONS = ['boxOccluders', 'occludeModels'];
const files = [null, null];
const $ = id => document.getElementById(id);
let resultText = '';

function sig(el) {
  const a = [...el.attributes].map(x => x.name + '=' + x.value).sort().join(',');
  const kids = [...el.children];
  const t = kids.length ? kids.map(sig).join('') : el.textContent.replace(/\s+/g, '');
  return '(' + el.localName + '|' + a + '|' + t + ')';
}

function indent(d, node, lv) {
  const kids = [...node.childNodes];
  if (!kids.some(k => k.nodeType === 1)) return;
  kids.forEach(k => { if (k.nodeType === 3 && !k.nodeValue.trim()) node.removeChild(k); });
  [...node.children].forEach(c => {
    node.insertBefore(d.createTextNode('\n' + '  '.repeat(lv + 1)), c);
    indent(d, c, lv + 1);
  });
  node.appendChild(d.createTextNode('\n' + '  '.repeat(lv)));
}

async function parse(f) {
  const d = new DOMParser().parseFromString(await f.text(), 'application/xml');
  if (d.querySelector('parsererror')) throw new Error(f.name + ' geçerli bir XML dosyası değil.');
  return d;
}

const sec = (d, n) => [...d.documentElement.children].find(c => c.localName === n);

[0, 1].forEach(i => {
  const z = $('z' + i), inp = $('f' + i);
  const set = f => {
    if (!f) return;
    files[i] = f;
    z.classList.add('ok');
    $('n' + i).textContent = f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)';
    $('go').disabled = !(files[0] && files[1]);
  };
  inp.onchange = () => set(inp.files[0]);
  z.ondragover = e => { e.preventDefault(); z.classList.add('over'); };
  z.ondragleave = () => z.classList.remove('over');
  z.ondrop = e => { e.preventDefault(); z.classList.remove('over'); set(e.dataTransfer.files[0]); };
});

$('go').onclick = async () => {
  const msg = $('msg');
  msg.className = '';
  msg.textContent = 'İşleniyor…';
  $('out').hidden = true;
  await new Promise(r => setTimeout(r, 30));
  try {
    const [d1, d2] = await Promise.all(files.map(parse));
    let rows = '', found = false, commonTotal = 0, itemsTotal = 0;

    for (const s of SECTIONS) {
      const n1 = sec(d1, s), n2 = sec(d2, s);
      const i1 = n1 ? [...n1.children] : [];
      const i2 = n2 ? [...n2.children] : [];
      if (n1 || n2) found = true;
      const g1 = i1.map(sig);
      const s1 = new Set(g1), s2 = new Set(i2.map(sig));
      const common = new Set([...s1].filter(x => s2.has(x)));
      commonTotal += common.size;
      itemsTotal += s1.size + s2.size;

      if (n1) {
        const kept = [], seen = new Set();
        i1.forEach((el, k) => {
          if (common.has(g1[k]) && !seen.has(g1[k])) { seen.add(g1[k]); kept.push(el); }
        });
        i1.forEach(el => n1.removeChild(el));
        kept.forEach(el => n1.appendChild(el));
      }
      rows += `<tr><td>${s}</td><td>${s1.size}</td><td>${s2.size}</td><td class="good">${common.size}</td>` +
              `<td class="bad">${s1.size - common.size}</td><td class="bad">${s2.size - common.size}</td></tr>`;
    }

    if (!found) throw new Error('Dosyalarda boxOccluders / occludeModels bölümü bulunamadı. Bunlar occlusion ymap XML dosyası mı?');

    indent(d1, d1.documentElement, 0);
    let xml = new XMLSerializer().serializeToString(d1);
    if (!xml.startsWith('<?xml')) xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + xml;
    resultText = xml;

    $('rows').innerHTML = rows;
    $('warn').textContent = (commonTotal === 0 && itemsTotal > 0)
      ? 'Uyarı: hiç ortak kayıt yok. Dosyalar yanlış seçilmiş olabilir, sonucu kullanmadan önce kontrol et.' : '';
    $('out').hidden = false;
    msg.textContent = 'Hazır.';
  } catch (e) {
    msg.className = 'err';
    msg.textContent = e.message;
  }
};

$('dl').onclick = () => {
  const blob = new Blob([resultText], { type: 'application/xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = $('name').value.trim() || 'occlusion3.ymap.xml';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
</script>
</body>
</html>
